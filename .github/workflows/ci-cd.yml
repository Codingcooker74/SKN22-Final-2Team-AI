name: FastAPI Test EB CI/CD

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - develop
    paths:
      - ".github/workflows/ci-cd.yml"
      - "deploy/eb/deploy-fastapi/**"
      - "Dockerfile"
      - "requirements.txt"
      - "main.py"
      - "final_ai/**"
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/ci-cd.yml"
      - "deploy/eb/deploy-fastapi/**"
      - "Dockerfile"
      - "requirements.txt"
      - "main.py"
      - "final_ai/**"

permissions:
  contents: read

concurrency:
  group: test-eb-deploy-fastapi-develop
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  FASTAPI_IMAGE_REPO: 027099020675.dkr.ecr.ap-northeast-2.amazonaws.com/test-tailtalk-fastapi
  FASTAPI_EB_APP_NAME: test-tailtalk-fastapi
  FASTAPI_EB_ENV_NAME: test-tailtalk-fastapi-env
  FASTAPI_INTERNAL_TARGET_GROUP_NAME: tailtalk-fastapi-int-tg

jobs:
  ci:
    name: CI - Build Container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build FastAPI image
        run: docker build -t tailtalk-fastapi:ci .

      - name: Compile Python sources
        run: docker run --rm tailtalk-fastapi:ci python -m compileall main.py final_ai

      - name: Smoke test FastAPI app import
        run: docker run --rm tailtalk-fastapi:ci python -c "from main import app; print(app.title)"

      - name: Smoke test prewarmed FastEmbed cache
        run: |
          docker run --rm \
            -e FASTEMBED_LOCAL_FILES_ONLY=true \
            -e FASTEMBED_AUTO_DISABLE_LOW_MEMORY=false \
            tailtalk-fastapi:ci \
            python scripts/prewarm_fastembed.py

      - name: Smoke test FastAPI health endpoint
        run: |
          docker run --rm tailtalk-fastapi:ci \
            python -c "from fastapi.testclient import TestClient; import main; client = TestClient(main.app); resp = client.get('/health'); assert resp.status_code == 200, resp.text"

      - name: Validate deploy compose bundle
        run: |
          rm -rf .deploy-fastapi
          mkdir -p .deploy-fastapi
          python3 - <<'PY'
          from pathlib import Path
          src = Path("deploy/eb/deploy-fastapi/docker-compose.yml").read_text()
          Path(".deploy-fastapi/docker-compose.yml").write_text(
              src.replace("__FASTAPI_IMAGE__", "tailtalk-fastapi:ci")
          )
          PY
          cat <<'EOF' > .deploy-fastapi/.env
          POSTGRES_DB=test_db
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=test_password
          POSTGRES_HOST=test-postgres
          POSTGRES_PORT=5432
          OPENAI_API_KEY=test-key
          EOF
          cp -r deploy/eb/deploy-fastapi/.platform .deploy-fastapi/.platform
          docker compose -f .deploy-fastapi/docker-compose.yml --env-file .deploy-fastapi/.env config -q
          test -f .deploy-fastapi/.platform/hooks/prebuild/01_ecr_login.sh
          test -f .deploy-fastapi/.platform/confighooks/prebuild/01_ecr_login.sh
          trap 'docker compose -f .deploy-fastapi/docker-compose.yml --env-file .deploy-fastapi/.env down -v --remove-orphans' EXIT
          docker compose -f .deploy-fastapi/docker-compose.yml --env-file .deploy-fastapi/.env up -d
          sleep 5
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1/health

  deploy-fastapi:
    name: CD - FastAPI Test EB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ci
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: fastapi-meta
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "version_label=fastapi-${short_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update FastAPI EB environment variables
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT || 5432 }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TIMEOUT_SECONDS: ${{ secrets.OPENAI_TIMEOUT_SECONDS }}
          POSTGRES_CONNECT_TIMEOUT_SECONDS: ${{ secrets.POSTGRES_CONNECT_TIMEOUT_SECONDS }}
          POSTGRES_STATEMENT_TIMEOUT_MS: ${{ secrets.POSTGRES_STATEMENT_TIMEOUT_MS }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING || 'false' }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_WORKSPACE_ID: ${{ secrets.LANGSMITH_WORKSPACE_ID }}
          FASTEMBED_MODEL: ${{ secrets.FASTEMBED_MODEL || 'intfloat/multilingual-e5-large' }}
          FASTEMBED_CACHE_PATH: ${{ secrets.FASTEMBED_CACHE_PATH || '/opt/fastembed-cache' }}
          FASTEMBED_LOCAL_FILES_ONLY: ${{ secrets.FASTEMBED_LOCAL_FILES_ONLY || 'true' }}
          FASTEMBED_AUTO_DISABLE_LOW_MEMORY: ${{ secrets.FASTEMBED_AUTO_DISABLE_LOW_MEMORY || 'true' }}
          FASTAPI_UVICORN_WORKERS: ${{ secrets.FASTAPI_UVICORN_WORKERS || '1' }}
        run: |
          options_file="$RUNNER_TEMP/fastapi-eb-env-options.json"
          python3 - <<'PY' > "$options_file"
          import json
          import os

          required_names = [
              "POSTGRES_DB",
              "POSTGRES_USER",
              "POSTGRES_PASSWORD",
              "POSTGRES_HOST",
              "POSTGRES_PORT",
              "OPENAI_API_KEY",
          ]
          optional_names = [
              "OPENAI_TIMEOUT_SECONDS",
              "POSTGRES_CONNECT_TIMEOUT_SECONDS",
              "POSTGRES_STATEMENT_TIMEOUT_MS",
              "INTERNAL_SERVICE_TOKEN",
              "LANGSMITH_TRACING",
              "LANGSMITH_API_KEY",
              "LANGSMITH_PROJECT",
              "LANGSMITH_ENDPOINT",
              "LANGSMITH_WORKSPACE_ID",
              "FASTEMBED_MODEL",
              "FASTEMBED_CACHE_PATH",
              "FASTEMBED_LOCAL_FILES_ONLY",
              "FASTEMBED_AUTO_DISABLE_LOW_MEMORY",
              "FASTAPI_UVICORN_WORKERS",
          ]

          missing = [name for name in required_names if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required EB environment values: {', '.join(missing)}")

          options = []
          for name in required_names + optional_names:
              value = os.environ.get(name)
              if value is None or (name in optional_names and value == ""):
                  continue
              options.append(
                  {
                      "Namespace": "aws:elasticbeanstalk:application:environment",
                      "OptionName": name,
                      "Value": value,
                  }
              )
          print(json.dumps(options))
          PY
          aws elasticbeanstalk update-environment \
            --environment-name "$FASTAPI_EB_ENV_NAME" \
            --option-settings "file://$options_file"
          aws elasticbeanstalk wait environment-updated \
            --environment-names "$FASTAPI_EB_ENV_NAME"

      - name: Build & push FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.FASTAPI_IMAGE_REPO }}:latest
            ${{ env.FASTAPI_IMAGE_REPO }}:${{ steps.fastapi-meta.outputs.short_sha }}

      - name: Create FastAPI deployment bundle
        run: |
          rm -rf .deploy-fastapi fastapi-deploy.zip
          mkdir -p .deploy-fastapi
          python3 - <<'PY'
          from pathlib import Path
          src = Path("deploy/eb/deploy-fastapi/docker-compose.yml").read_text()
          image = "${{ env.FASTAPI_IMAGE_REPO }}:${{ steps.fastapi-meta.outputs.short_sha }}"
          Path(".deploy-fastapi/docker-compose.yml").write_text(
              src.replace("__FASTAPI_IMAGE__", image)
          )
          PY
          cat <<'EOF' > .deploy-fastapi/.env.check
          POSTGRES_DB=check_db
          POSTGRES_USER=check_user
          POSTGRES_PASSWORD=check_password
          POSTGRES_HOST=check-postgres
          POSTGRES_PORT=5432
          OPENAI_API_KEY=check-key
          OPENAI_TIMEOUT_SECONDS=20
          POSTGRES_CONNECT_TIMEOUT_SECONDS=5
          POSTGRES_STATEMENT_TIMEOUT_MS=20000
          INTERNAL_SERVICE_TOKEN=
          LANGSMITH_TRACING=false
          LANGSMITH_API_KEY=
          LANGSMITH_PROJECT=
          LANGSMITH_ENDPOINT=
          LANGSMITH_WORKSPACE_ID=
          FASTEMBED_MODEL=intfloat/multilingual-e5-large
          FASTEMBED_CACHE_PATH=/opt/fastembed-cache
          FASTEMBED_LOCAL_FILES_ONLY=true
          FASTEMBED_AUTO_DISABLE_LOW_MEMORY=true
          FASTAPI_UVICORN_WORKERS=1
          EOF
          docker compose -f .deploy-fastapi/docker-compose.yml --env-file .deploy-fastapi/.env.check config -q
          cp -r deploy/eb/deploy-fastapi/.platform .deploy-fastapi/.platform
          cd .deploy-fastapi
          zip -r ../fastapi-deploy.zip docker-compose.yml .platform

      - name: Deploy FastAPI to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ env.AWS_REGION }}
          application_name: ${{ env.FASTAPI_EB_APP_NAME }}
          environment_name: ${{ env.FASTAPI_EB_ENV_NAME }}
          version_label: ${{ steps.fastapi-meta.outputs.version_label }}
          deployment_package: fastapi-deploy.zip
          use_existing_version_if_available: true
          wait_for_deployment: true

      - name: Resolve FastAPI environment resources
        id: fastapi-resources
        run: |
          asg_name="$(aws elasticbeanstalk describe-environment-resources \
            --environment-name "$FASTAPI_EB_ENV_NAME" \
            --query 'EnvironmentResources.AutoScalingGroups[0].Name' \
            --output text)"
          instance_id="$(aws elasticbeanstalk describe-environment-resources \
            --environment-name "$FASTAPI_EB_ENV_NAME" \
            --query 'EnvironmentResources.Instances[0].Id' \
            --output text)"
          if [ -z "$asg_name" ] || [ "$asg_name" = "None" ]; then
            echo "FastAPI Auto Scaling group not found for $FASTAPI_EB_ENV_NAME" >&2
            exit 1
          fi
          if [ -z "$instance_id" ] || [ "$instance_id" = "None" ]; then
            echo "FastAPI instance not found for $FASTAPI_EB_ENV_NAME" >&2
            exit 1
          fi
          echo "asg_name=$asg_name" >> "$GITHUB_OUTPUT"
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"

      - name: Resolve FastAPI internal target group
        id: fastapi-int-tg
        run: |
          target_group_arn="$(aws elbv2 describe-target-groups \
            --names "$FASTAPI_INTERNAL_TARGET_GROUP_NAME" \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text)"
          health_check_path="$(aws elbv2 describe-target-groups \
            --target-group-arns "$target_group_arn" \
            --query 'TargetGroups[0].HealthCheckPath' \
            --output text)"
          if [ -z "$target_group_arn" ] || [ "$target_group_arn" = "None" ]; then
            echo "FastAPI internal target group not found: $FASTAPI_INTERNAL_TARGET_GROUP_NAME" >&2
            exit 1
          fi
          echo "target_group_arn=$target_group_arn" >> "$GITHUB_OUTPUT"
          echo "health_check_path=$health_check_path" >> "$GITHUB_OUTPUT"

      - name: Reattach FastAPI internal target group
        run: |
          aws autoscaling attach-load-balancer-target-groups \
            --auto-scaling-group-name "${{ steps.fastapi-resources.outputs.asg_name }}" \
            --target-group-arns "${{ steps.fastapi-int-tg.outputs.target_group_arn }}"

      - name: Wait for FastAPI internal health check
        env:
          FASTAPI_INSTANCE_ID: ${{ steps.fastapi-resources.outputs.instance_id }}
          FASTAPI_TARGET_GROUP_ARN: ${{ steps.fastapi-int-tg.outputs.target_group_arn }}
          FASTAPI_TARGET_HEALTH_PATH: ${{ steps.fastapi-int-tg.outputs.health_check_path }}
        run: |
          for attempt in $(seq 1 30); do
            target_state="$(aws elbv2 describe-target-health \
              --target-group-arn "$FASTAPI_TARGET_GROUP_ARN" \
              --query "TargetHealthDescriptions[?Target.Id=='$FASTAPI_INSTANCE_ID'].TargetHealth.State | [0]" \
              --output text)"
            if [ "$target_state" = "healthy" ]; then
              echo "FastAPI instance $FASTAPI_INSTANCE_ID is healthy on $FASTAPI_TARGET_HEALTH_PATH"
              exit 0
            fi
            echo "Attempt $attempt/30: internal target state=${target_state:-missing}; waiting 10s."
            sleep 10
          done
          aws elbv2 describe-target-health --target-group-arn "$FASTAPI_TARGET_GROUP_ARN"
          exit 1
