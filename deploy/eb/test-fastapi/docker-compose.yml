services:
  fastapi:
    image: __FASTAPI_IMAGE__
    platform: linux/amd64
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --workers 1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      FASTEMBED_MODEL: intfloat/multilingual-e5-large
      FASTEMBED_CACHE_PATH: /opt/fastembed-cache
      FASTEMBED_LOCAL_FILES_ONLY: "true"
      FASTEMBED_AUTO_DISABLE_LOW_MEMORY: "true"
      FASTAPI_UVICORN_WORKERS: "1"
    # Docker Hub 인증은 .ebextensions의 docker login으로 처리
    ports:
      - "80:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
