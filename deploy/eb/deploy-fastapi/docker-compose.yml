services:
  fastapi:
    image: __FASTAPI_IMAGE__
    platform: linux/amd64
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --workers 1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-20}
      POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:-5}
      POSTGRES_STATEMENT_TIMEOUT_MS: ${POSTGRES_STATEMENT_TIMEOUT_MS:-20000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      FASTEMBED_MODEL: ${FASTEMBED_MODEL:-intfloat/multilingual-e5-large}
      FASTEMBED_CACHE_PATH: ${FASTEMBED_CACHE_PATH:-/opt/fastembed-cache}
      FASTEMBED_LOCAL_FILES_ONLY: ${FASTEMBED_LOCAL_FILES_ONLY:-true}
      FASTEMBED_AUTO_DISABLE_LOW_MEMORY: ${FASTEMBED_AUTO_DISABLE_LOW_MEMORY:-true}
      FASTAPI_UVICORN_WORKERS: ${FASTAPI_UVICORN_WORKERS:-1}
    # Private ECR 인증은 .platform/hooks/prebuild 의 docker login 으로 처리
    ports:
      - "80:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
